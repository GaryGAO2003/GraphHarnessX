[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphharnessx"
version = "0.1.0"
description = "GraphHarnessX: graph-native harness evolution (GHX) on top of the HarnessX agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gary Gao"},
]
keywords = ["agent", "harness", "llm", "self-evolving", "causal-graph", "gaia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # LLM providers & HTTP
    "pydantic>=2.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "litellm>=1.40",
    "httpx>=0.27",
    # Logging & config
    "structlog>=24.0",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # Browser automation
    "playwright>=1.45",
    "html2text>=2024.0",
    # MCP server support
    "mcp>=1.0",
    # OpenTelemetry tracing
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    # Sandbox backends
    "docker>=7.0",
    "e2b>=0.17",
    # Document / office skills
    "python-pptx>=0.6.21",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0",
    "pdfplumber>=0.10",
]

[project.urls]
Repository = "https://github.com/GaryGAO2003/GraphHarnessX"
Upstream = "https://github.com/Darwin-Agent/HarnessX"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "cachetools>=5.3"]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessx*"]

[tool.setuptools.package-data]
"harnessx" = [
    "workspace/default_prompts/**/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
